<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in{% if app_title %} — {{ app_title }}{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4f52cc', hover: '#3d40b0' },
          },
          fontFamily: {
            sans: ['"Source Sans 3"', 'Segoe UI', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/next-experience.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-6 font-sans" style="{{ sidebar_style }} background: var(--now-canvas, #f4f4f4);">
  <form method="post" action="/login" class="bg-white w-full max-w-sm overflow-hidden" style="border-radius: 8px; box-shadow: 0 12px 40px rgba(15,23,42,0.14);">
    <div class="px-8 pt-7 pb-5" style="background-color: var(--sidebar-bg); color: var(--sidebar-text);">
      <div class="flex items-center gap-3">
        {% if branding.logo_url %}
        <div class="nx-logo-plate">
          <img src="{{ branding.logo_url }}" alt="" />
        </div>
        {% endif %}
        {% if app_title %}
        <div>
          <h1 class="text-lg font-semibold tracking-tight">{{ app_title }}</h1>
          <p class="text-sm opacity-80 mt-0.5">Sign in</p>
        </div>
        {% else %}
        <div>
          <h1 class="text-lg font-semibold tracking-tight">Sign in</h1>
        </div>
        {% endif %}
      </div>
    </div>
    <div class="p-8 space-y-5">
    {% if request.query_params.get('error') %}
    <p class="text-sm text-red-600">Invalid username or password.</p>
    {% endif %}
    <div>
      <label class="block text-sm font-medium text-slate-700">Username or user ID</label>
      <input name="username" required autocomplete="username"
        class="mt-1 w-full border border-slate-300 px-3 py-2 text-sm" style="border-radius: 4px;" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Password</label>
      <input type="password" name="password" required autocomplete="current-password"
        class="mt-1 w-full border border-slate-300 px-3 py-2 text-sm" style="border-radius: 4px;" />
    </div>
    <button type="submit" class="w-full bg-primary text-white py-2.5 text-sm font-semibold hover:bg-primary-hover" style="border-radius: 4px;">
      Sign in
    </button>
    <p class="text-xs text-slate-400 text-center">Use an account created by your administrator (bootstrap via env on first install).</p>
    </div>
  </form>
</body>
</html>
