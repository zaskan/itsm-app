{# Expects: scope_label, fields (list), add_action, delete_prefix #}
<div class="mt-4 border-t border-slate-100 pt-4">
  <h4 class="text-xs font-semibold text-slate-600 uppercase tracking-wide mb-2">Custom fields</h4>
  {% if fields %}
  <ul class="space-y-2 mb-3">
    {% for f in fields %}
    <li class="flex items-center justify-between text-sm bg-slate-50 rounded px-3 py-2">
      <span><code class="text-xs">{{ f.field_key }}</code> — {{ f.label }} ({{ f.field_type }}){% if f.required %} *{% endif %}</span>
      <form method="post" action="{{ delete_prefix }}/{{ f.id }}/delete" onsubmit="return confirm('Delete field?');">
        <button type="submit" class="text-xs text-red-600 hover:underline">Remove</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
  <form method="post" action="{{ add_action }}" class="grid sm:grid-cols-2 gap-2 text-sm">
    <input name="field_key" required placeholder="field_key" pattern="[a-z][a-z0-9_]*" class="rounded border border-slate-300 px-2 py-1.5" />
    <input name="label" required placeholder="Label" class="rounded border border-slate-300 px-2 py-1.5" />
    <select name="field_type" class="rounded border border-slate-300 px-2 py-1.5">
      <option value="text">Text</option>
      <option value="textarea">Textarea</option>
      <option value="number">Number</option>
      <option value="boolean">Boolean</option>
      <option value="select">Select</option>
      <option value="date">Date</option>
    </select>
    <input name="options" placeholder="Options (comma, for select)" class="rounded border border-slate-300 px-2 py-1.5" />
    <label class="flex items-center gap-2 text-xs text-slate-600">
      <input type="checkbox" name="required" value="1" /> Required
    </label>
    <button type="submit" class="rounded bg-slate-700 text-white px-3 py-1.5 text-xs sm:col-span-2 w-fit">Add field</button>
  </form>
</div>
