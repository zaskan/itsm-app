apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: itsm-data
  namespace: itsm-app
  labels:
    app: itsm-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # Omit storageClassName to use the cluster default (typical on OpenShift).
  # storageClassName: gp3-csi
